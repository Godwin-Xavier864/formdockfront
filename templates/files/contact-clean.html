<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form - Clean</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(160deg, #f0f6ff, #ffffff);
        color: #10233f;
      }
      .wrap {
        max-width: 720px;
        margin: 48px auto;
        padding: 24px;
      }
      h1 {
        margin: 0 0 6px;
      }
      p {
        margin: 0 0 20px;
        color: #426087;
      }
      form {
        display: grid;
        gap: 14px;
        background: #ffffff;
        border: 1px solid #d7e5f8;
        border-radius: 14px;
        padding: 18px;
      }
      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }
      input,
      textarea {
        border: 1px solid #bfcee5;
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
      }
      button {
        width: fit-content;
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        font-weight: 700;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <section class="wrap">
      <h1>Let's Work Together</h1>
      <p>Send us your enquiry and the team will get back within one business day.</p>
      <form>
        <label>
          Name
          <input type="text" placeholder="Jane Doe" />
        </label>
        <label>
          Email
          <input type="email" placeholder="jane@example.com" />
        </label>
        <label>
          Message
          <textarea rows="5" placeholder="Write your request..."></textarea>
        </label>
        <button type="button">Submit Enquiry</button>
      </form>
    </section>
  </body>
</html>
