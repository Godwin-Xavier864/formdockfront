<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | FormDock</title>
    <meta http-equiv="refresh" content="1; url=/login" />
    <link rel="icon" type="image/png" href="/formdock-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
      body {
        background: #060913;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 48px 36px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .logo { height: 42px; margin-bottom: 24px; }
      .code { font-size: 4.5rem; font-weight: 900; color: #ff6b00; line-height: 1; letter-spacing: -2px; margin-bottom: 12px; }
      .title { font-size: 1.35rem; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
      .desc { color: #94a3b8; font-size: 0.92rem; line-height: 1.5; margin-bottom: 28px; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #ff6b00;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 12px 28px;
        border-radius: 9999px;
        transition: transform 0.15s ease, background 0.15s ease;
        width: 100%;
      }
      .btn:hover { background: #e05e00; transform: translateY(-1px); }
    </style>
    <script>
      // Immediately route to login
      window.location.replace('/login');
    </script>
  </head>
  <body>
    <div class="card">
      <img src="/formdock-logo-dark.png" alt="FormDock" class="logo" />
      <div class="code">404</div>
      <div class="title">Page Not Found</div>
      <p class="desc">The requested page doesn't exist. Routing you to Login...</p>
      <a href="/login" class="btn">Go to Login</a>
    </div>
  </body>
</html>
