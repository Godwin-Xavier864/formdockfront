<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff8ef" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | FormDock</title>
    <link id="formdock-favicon" rel="icon" type="image/png" href="__FORMDOCK_SITE_BASE__formdock-sunrise-logo.png" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #fff8ef;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 5%, rgba(255, 174, 82, 0.2), transparent 46%),
          linear-gradient(145deg, #fffaf4, #f5f7fb);
      }

      .not-found-card {
        width: min(100%, 520px);
        padding: clamp(28px, 7vw, 52px);
        border: 1px solid rgba(214, 219, 228, 0.9);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 24px 70px rgba(31, 41, 55, 0.1);
        text-align: center;
      }

      .brand-lockup {
        display: inline-flex;
        max-width: 100%;
        align-items: center;
        justify-content: center;
        padding: 5px 10px;
        margin-bottom: 24px;
        border-radius: 10px;
        background: #fff;
      }

      .brand-lockup img {
        display: block;
        width: min(100%, 220px);
        height: 58px;
        object-fit: contain;
      }

      .error-code {
        margin: 0;
        color: #ef6a12;
        font-size: clamp(4.6rem, 18vw, 7rem);
        font-weight: 850;
        letter-spacing: -0.095em;
        line-height: 0.95;
      }

      h1 {
        margin: 18px 0 10px;
        color: #172033;
        font-size: clamp(1.4rem, 5vw, 1.8rem);
        letter-spacing: -0.04em;
      }

      .description {
        max-width: 380px;
        margin: 0 auto 26px;
        color: #64748b;
        font-size: 0.96rem;
        line-height: 1.65;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      .button {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        padding: 11px 20px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: #f4f6f9;
        color: #334155;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: background 150ms ease, border-color 150ms ease, transform 150ms ease;
      }

      .button:hover { transform: translateY(-1px); }

      .button-primary {
        background: #f26a12;
        color: #fff;
      }

      .button-primary:hover { background: #d95a0a; }
      .button-secondary { border-color: #d9dee7; }
      .button-secondary:hover { background: #e9edf3; }

      .help-text {
        margin: 24px 0 0;
        color: #8993a3;
        font-size: 0.77rem;
      }

      @media (max-width: 420px) {
        .actions { flex-direction: column; }
        .button { width: 100%; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="not-found-card">
      <div class="brand-lockup"><img id="formdock-logo" src="__FORMDOCK_SITE_BASE__formdock-sunrise-logo.png" alt="FormDock" /></div>
      <p class="error-code" aria-hidden="true">404</p>
      <h1>We couldn’t find that page</h1>
      <p class="description">The link may be out of date or the address may have a typo. Head back to FormDock and continue from there.</p>
      <div class="actions">
        <a id="home-link" class="button button-primary" href="__FORMDOCK_SITE_BASE__">Back to FormDock</a>
        <button id="back-button" class="button button-secondary" type="button">Go back</button>
      </div>
      <p class="help-text">FormDock · Forms, stores, and everything connected.</p>
    </main>

    <script>
      (() => {
        const configuredBase = '__FORMDOCK_SITE_BASE__'
        const segments = window.location.pathname.split('/').filter(Boolean)
        const inferredBase = window.location.hostname.endsWith('.github.io') && segments.length > 1
          ? `/${segments[0]}/`
          : '/'
        const siteBase = configuredBase.startsWith('__FORMDOCK_') ? inferredBase : configuredBase
        const logoUrl = `${siteBase}formdock-sunrise-logo.png`

        document.getElementById('formdock-logo').src = logoUrl
        document.getElementById('formdock-favicon').href = logoUrl
        document.getElementById('home-link').href = siteBase

        const baseRoot = siteBase === '/' ? '' : siteBase.replace(/\/+$/, '')
        let route = window.location.pathname
        if (baseRoot && (route === baseRoot || route.startsWith(`${baseRoot}/`))) {
          route = route.slice(baseRoot.length) || '/'
        }
        route = route.replace(/\/+$/, '') || '/'

        const knownRoutes = new Set([
          '/', '/login', '/signup', '/delivery', '/driver', '/shop-demo',
          '/verify-email', '/forgot-password', '/terms', '/privacy'
        ])
        const isOrderTrackingRoute = /^\/orders\/track\/[a-f0-9-]+$/i.test(route)

        if (knownRoutes.has(route) || isOrderTrackingRoute) {
          const originalUrl = `${window.location.pathname}${window.location.search}${window.location.hash}`
          const appUrl = new URL(siteBase, window.location.origin)
          appUrl.searchParams.set('__formdock_route', originalUrl)
          window.location.replace(appUrl.toString())
          return
        }

        document.getElementById('back-button').addEventListener('click', () => {
          if (window.history.length > 1) window.history.back()
          else window.location.assign(siteBase)
        })
      })()
    </script>
  </body>
</html>
