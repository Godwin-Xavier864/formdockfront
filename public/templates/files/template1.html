<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Form</title>
    <!-- Modern Premium Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e293b;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.4);
            --input-border: rgba(255, 255, 255, 0.05);
            --input-focus: #6366f1;
            --success-bg: rgba(34, 197, 94, 0.1);
            --success-text: #4ade80;
            --error-bg: rgba(239, 68, 68, 0.1);
            --error-text: #f87171;
            --ring: rgba(99, 102, 241, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-primary);
            margin: 0;
            padding: 40px 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 640px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 16px;
            margin: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        input,
        textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 15px;
            color: var(--text-primary);
            box-sizing: border-box;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        input:hover,
        textarea:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.6);
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 4px var(--ring);
            background: rgba(15, 23, 42, 0.8);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .input-group:focus-within label {
            color: var(--text-primary);
        }

        button {
            width: 100%;
            margin-top: 16px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        }

        button:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.23);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: translateY(0);
        }

        .result {
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            transition: all 0.4s ease;
        }

        .result:empty {
            display: none;
        }

        .success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid rgba(74, 222, 128, 0.2);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.1);
        }

        .error {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid rgba(248, 113, 113, 0.2);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.1);
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <h1>Contact Us</h1>
            <p>We'd love to hear from you. Please fill out this form.</p>
        </div>

        <form id="formdockForm" class="form-grid">
            <div class="input-group">
                <label for="firstName">First Name</label>
                <input id="firstName" placeholder="John" />
            </div>

            <div class="input-group">
                <label for="lastName">Last Name</label>
                <input id="lastName" placeholder="Doe" />
            </div>

            <div class="input-group full-width">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="john@example.com" />
            </div>

            <div class="input-group">
                <label for="organization">Organization</label>
                <input id="organization" placeholder="Company" />
            </div>

            <div class="input-group">
                <label for="place">Place</label>
                <input id="place" placeholder="City" />
            </div>

            <div class="input-group full-width">
                <label for="message">Message</label>
                <textarea id="message" placeholder="Your message..."></textarea>
            </div>

            <div class="full-width">
                <button type="submit" id="submitBtn">Submit</button>
            </div>
        </form>

        <div class="result" id="result"></div>
    </div>

    <!-- The original JavaScript code goes completely unchanged. -->
    <script>
        const form = document.getElementById("formdockForm");
        const result = document.getElementById("result");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            submitBtn.disabled = true;

            result.textContent = "Submitting...";
            result.className = "result";

            const payload = {
                project_api_key: "YOUR_API_KEY",
                fields: {
                    first_name: document.getElementById("firstName").value.trim(),
                    last_name: document.getElementById("lastName").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    organization: document.getElementById("organization").value.trim(),
                    place: document.getElementById("place").value.trim(),
                    message: document.getElementById("message").value.trim()
                },
                metadata: {
                    page_url: window.location.href,
                    referrer: document.referrer || "",
                    user_agent: navigator.userAgent,
                    timestamp: new Date().toISOString()
                }
            };

            try {
                const response = await fetch("https://api.formdock.in/api/forms/submit/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    result.textContent = "Form submitted successfully ✅";
                    result.className = "result success";
                    form.reset();
                } else {
                    result.textContent = "Submission failed ❌";
                    result.className = "result error";
                }

            } catch (error) {
                result.textContent = "Something went wrong ❌";
                result.className = "result error";
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
