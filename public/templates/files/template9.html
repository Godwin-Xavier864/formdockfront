<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Form - Professional Sage</title>
    <!-- Pristine Institutional App Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* Professional Institutional Green Palette */
            --bg-color: #EBF0ED;
            /* Very soft muted sage background */
            --card-bg: #FFFFFF;
            --text-main: #132A1D;
            /* Extremely dark forest green */
            --text-muted: #577061;
            /* Muted gray-green */
            --input-bg: #FAFCFA;
            --input-border: #D1DDD5;
            --input-focus: #285E40;
            /* Rich Emerald/Forest Green */
            --input-ring: rgba(40, 94, 64, 0.15);
            --btn-bg: #1F4A33;
            /* Deep corporate green */
            --btn-hover: #153424;
            --btn-text: #FFFFFF;
            /* Semantic Clean Colors */
            --success-bg: #E8F5E9;
            --success-text: #2E7D32;
            --success-border: #C8E6C9;
            --error-bg: #FFEBEE;
            --error-text: #C62828;
            --error-border: #FFCDD2;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(ellipse at top left, rgba(255, 255, 255, 0.9) 0%, transparent 60%),
                radial-gradient(ellipse at bottom right, rgba(40, 94, 64, 0.05) 0%, transparent 60%);
            color: var(--text-main);
            margin: 0;
            padding: 60px 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 48px;
            /* Subtle deep green-tinted shadow */
            box-shadow: 0 20px 40px rgba(19, 42, 29, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
        }

        .header {
            margin-bottom: 36px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 8px 0;
            letter-spacing: -1px;
        }

        .header p {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-left: 4px;
        }

        input,
        textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 15px;
            font-family: inherit;
            font-weight: 500;
            color: var(--text-main);
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input::placeholder,
        textarea::placeholder {
            color: #9AAEA1;
            font-weight: 400;
        }

        input:hover,
        textarea:hover {
            border-color: #A3B5AA;
        }

        input:focus,
        textarea:focus {
            outline: none;
            background: #FFFFFF;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 4px var(--input-ring);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 16px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 12px;
            padding: 18px;
            font-size: 16px;
            font-family: inherit;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(31, 74, 51, 0.2);
            transition: all 0.3s ease;
        }

        button:hover:not(:disabled) {
            background: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(31, 74, 51, 0.3);
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: 0 4px 12px rgba(31, 74, 51, 0.2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result {
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
        }

        .result:empty {
            display: none;
        }

        .success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .error {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 40px 24px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <h1>Contact Us</h1>
            <p>We'd love to hear from you. Please fill out this form.</p>
        </div>

        <form id="formdockForm" class="form-grid">
            <div class="input-group">
                <label for="firstName">First name</label>
                <input id="firstName" placeholder="John" />
            </div>

            <div class="input-group">
                <label for="lastName">Last name</label>
                <input id="lastName" placeholder="Doe" />
            </div>

            <div class="input-group full-width">
                <label for="email">Email address</label>
                <input id="email" type="email" placeholder="john@example.com" />
            </div>

            <div class="input-group">
                <label for="organization">Organization</label>
                <input id="organization" placeholder="Company inc" />
            </div>

            <div class="input-group">
                <label for="place">Place</label>
                <input id="place" placeholder="City" />
            </div>

            <div class="input-group full-width">
                <label for="message">Message</label>
                <textarea id="message" placeholder="How can we help you?"></textarea>
            </div>

            <div class="full-width">
                <button type="submit" id="submitBtn">Send Message</button>
            </div>
        </form>

        <div class="result" id="result"></div>
    </div>

    <!-- The original JavaScript code remains completely unchanged. -->
    <script>
        const form = document.getElementById("formdockForm");
        const result = document.getElementById("result");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            submitBtn.disabled = true;

            result.textContent = "Submitting...";
            result.className = "result";

            const payload = {
                project_api_key: "YOUR_API_KEY",
                fields: {
                    first_name: document.getElementById("firstName").value.trim(),
                    last_name: document.getElementById("lastName").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    organization: document.getElementById("organization").value.trim(),
                    place: document.getElementById("place").value.trim(),
                    message: document.getElementById("message").value.trim()
                },
                metadata: {
                    page_url: window.location.href,
                    referrer: document.referrer || "",
                    user_agent: navigator.userAgent,
                    timestamp: new Date().toISOString()
                }
            };

            try {
                const response = await fetch("https://api.formdock.in/api/forms/submit/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    result.textContent = "Form submitted successfully ✅";
                    result.className = "result success";
                    form.reset();
                } else {
                    result.textContent = "Submission failed ❌";
                    result.className = "result error";
                }

            } catch (error) {
                result.textContent = "Something went wrong ❌";
                result.className = "result error";
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
