<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Form - Advanced</title>
    <!-- Technical & Precise Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Advanced Minimalist Dark Theme */
            --bg-base: #000000;
            --surface-bg: rgba(14, 14, 14, 0.7);
            --surface-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(0, 0, 0, 0.4);
            --input-border: rgba(255, 255, 255, 0.12);
            --input-border-hover: rgba(255, 255, 255, 0.3);
            --text-heading: #ffffff;
            --text-body: #a1a1aa;
            --text-label: #a1a1aa;
            --text-placeholder: #52525b;
            --btn-bg: #ececec;
            --btn-text: #09090b;
            --success-bg: rgba(34, 197, 94, 0.08);
            --success-text: #4ade80;
            --success-border: rgba(34, 197, 94, 0.2);
            --error-bg: rgba(239, 68, 68, 0.08);
            --error-text: #f87171;
            --error-border: rgba(239, 68, 68, 0.2);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-body);
            margin: 0;
            padding: 40px 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }

        /* High-tech Background Grid Masked by Radial Gradient */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(circle at center, black, transparent 75%);
            -webkit-mask-image: radial-gradient(circle at center, black, transparent 75%);
            z-index: -2;
            pointer-events: none;
        }

        /* Subtle Ambient Glow */
        body::after {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            width: 800px;
            height: 800px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.02) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: var(--surface-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .header {
            margin-bottom: 32px;
        }

        h1 {
            font-size: 22px;
            font-weight: 500;
            color: var(--text-heading);
            margin: 0 0 6px 0;
            letter-spacing: -0.04em;
        }

        .header p {
            color: var(--text-body);
            font-size: 14px;
            margin: 0;
            line-height: 1.5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 16px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-label);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        input,
        textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
            color: var(--text-heading);
            box-sizing: border-box;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--text-placeholder);
        }

        input:hover,
        textarea:hover {
            border-color: var(--input-border-hover);
        }

        input:focus,
        textarea:focus {
            outline: none;
            background: rgba(0, 0, 0, 0.8);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 12px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 10px rgba(255, 255, 255, 0.1);
        }

        button:hover:not(:disabled) {
            background: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.15);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #3f3f46;
            color: #a1a1aa;
            transform: none;
            box-shadow: none;
        }

        .result {
            margin-top: 24px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }

        .result:empty {
            display: none;
        }

        .success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .error {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
        }

        @media (max-width: 500px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <h1>Contact Us</h1>
            <p>We'd love to hear from you. Please fill out this form.</p>
        </div>

        <form id="formdockForm" class="form-grid">
            <div class="input-group">
                <label for="firstName">First name</label>
                <input id="firstName" placeholder="John" />
            </div>

            <div class="input-group">
                <label for="lastName">Last name</label>
                <input id="lastName" placeholder="Doe" />
            </div>

            <div class="input-group full-width">
                <label for="email">Email address</label>
                <input id="email" type="email" placeholder="john@example.com" />
            </div>

            <div class="input-group">
                <label for="organization">Organization</label>
                <input id="organization" placeholder="Company inc" />
            </div>

            <div class="input-group">
                <label for="place">Place</label>
                <input id="place" placeholder="City" />
            </div>

            <div class="input-group full-width">
                <label for="message">Message</label>
                <textarea id="message" placeholder="How can we help you?"></textarea>
            </div>

            <div class="full-width">
                <button type="submit" id="submitBtn">Send Message</button>
            </div>
        </form>

        <div class="result" id="result"></div>
    </div>

    <!-- The original JavaScript code remains completely unchanged. -->
    <script>
        const form = document.getElementById("formdockForm");
        const result = document.getElementById("result");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            submitBtn.disabled = true;

            result.textContent = "Submitting...";
            result.className = "result";

            const payload = {
                project_api_key: "YOUR_API_KEY",
                fields: {
                    first_name: document.getElementById("firstName").value.trim(),
                    last_name: document.getElementById("lastName").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    organization: document.getElementById("organization").value.trim(),
                    place: document.getElementById("place").value.trim(),
                    message: document.getElementById("message").value.trim()
                },
                metadata: {
                    page_url: window.location.href,
                    referrer: document.referrer || "",
                    user_agent: navigator.userAgent,
                    timestamp: new Date().toISOString()
                }
            };

            try {
                const response = await fetch("https://api.formdock.in/api/forms/submit/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    result.textContent = "Form submitted successfully ✅";
                    result.className = "result success";
                    form.reset();
                } else {
                    result.textContent = "Submission failed ❌";
                    result.className = "result error";
                }

            } catch (error) {
                result.textContent = "Something went wrong ❌";
                result.className = "result error";
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
