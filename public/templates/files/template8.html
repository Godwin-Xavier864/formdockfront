<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Form - Iridescent Aurora</title>
    <!-- Ultra Modern Geometric Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Iridescent Aurora Glass Palette */
            --text-primary: #1C1938;
            --text-muted: #5D5A88;
            --card-bg: rgba(255, 255, 255, 0.45);
            --card-border: rgba(255, 255, 255, 0.8);
            --card-shadow: rgba(0, 0, 0, 0.08);
            --input-bg: rgba(255, 255, 255, 0.35);
            --input-border: rgba(255, 255, 255, 0.6);
            --input-focus: rgba(255, 255, 255, 0.95);
            --btn-bg: #1C1938;
            /* Deep rich midnight indigo */
            --btn-hover: #0D0C1D;
            --btn-text: #FFFFFF;
            /* Status Colors adapted for glass */
            --success-bg: rgba(212, 250, 228, 0.7);
            --success-text: #14532D;
            --error-bg: rgba(254, 226, 226, 0.7);
            --error-text: #7F1D1D;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fcf1f4;
            /* Breathtaking multi-stop pastel mesh background simulating an aurora */
            background-image:
                radial-gradient(at 80% 0%, hsla(189, 100%, 86%, 1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(280, 100%, 85%, 1) 0px, transparent 50%),
                radial-gradient(at 80% 100%, hsla(340, 100%, 86%, 1) 0px, transparent 50%),
                radial-gradient(at 0% 0%, hsla(40, 100%, 85%, 1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            margin: 0;
            padding: 40px 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 620px;
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--card-border);
            border-radius: 36px;
            padding: 50px;
            /* Incredibly deep soft shadow mixed with an inner glowing edge */
            box-shadow: 0 40px 80px var(--card-shadow), inset 0 2px 4px rgba(255, 255, 255, 0.9);
            position: relative;
        }

        .header {
            margin-bottom: 36px;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 8px 0;
            letter-spacing: -1.5px;
        }

        .header p {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 16px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-left: 4px;
            opacity: 0.8;
        }

        input,
        textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 16px;
            font-family: inherit;
            font-weight: 400;
            color: var(--text-primary);
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            /* Inner shadow makes the inputs look cleanly recessed into the glass */
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        input:focus,
        textarea:focus {
            outline: none;
            background: var(--input-focus);
            border-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.5), inset 0 2px 6px rgba(0, 0, 0, 0.01);
            transform: translateY(-1px);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 16px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 16px;
            font-family: inherit;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(28, 25, 56, 0.25);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        button:hover:not(:disabled) {
            background: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 16px 32px rgba(28, 25, 56, 0.35);
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: 0 4px 12px rgba(28, 25, 56, 0.2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result {
            margin-top: 24px;
            padding: 18px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
        }

        .result:empty {
            display: none;
        }

        .success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .error {
            background: var(--error-bg);
            color: var(--error-text);
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 36px 24px;
                border-radius: 28px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <h1>Contact Us</h1>
            <p>We'd love to hear from you. Please fill out this form.</p>
        </div>

        <form id="formdockForm" class="form-grid">
            <div class="input-group">
                <label for="firstName">First name</label>
                <input id="firstName" placeholder="John" />
            </div>

            <div class="input-group">
                <label for="lastName">Last name</label>
                <input id="lastName" placeholder="Doe" />
            </div>

            <div class="input-group full-width">
                <label for="email">Email address</label>
                <input id="email" type="email" placeholder="john@example.com" />
            </div>

            <div class="input-group">
                <label for="organization">Organization</label>
                <input id="organization" placeholder="Company inc" />
            </div>

            <div class="input-group">
                <label for="place">Place</label>
                <input id="place" placeholder="City" />
            </div>

            <div class="input-group full-width">
                <label for="message">Message</label>
                <textarea id="message" placeholder="How can we help you?"></textarea>
            </div>

            <div class="full-width">
                <button type="submit" id="submitBtn">Send Message</button>
            </div>
        </form>

        <div class="result" id="result"></div>
    </div>

    <!-- The original JavaScript code remains completely unchanged. -->
    <script>
        const form = document.getElementById("formdockForm");
        const result = document.getElementById("result");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            submitBtn.disabled = true;

            result.textContent = "Submitting...";
            result.className = "result";

            const payload = {
                project_api_key: "YOUR_API_KEY",
                fields: {
                    first_name: document.getElementById("firstName").value.trim(),
                    last_name: document.getElementById("lastName").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    organization: document.getElementById("organization").value.trim(),
                    place: document.getElementById("place").value.trim(),
                    message: document.getElementById("message").value.trim()
                },
                metadata: {
                    page_url: window.location.href,
                    referrer: document.referrer || "",
                    user_agent: navigator.userAgent,
                    timestamp: new Date().toISOString()
                }
            };

            try {
                const response = await fetch("https://api.formdock.in/api/forms/submit/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    result.textContent = "Form submitted successfully ✅";
                    result.className = "result success";
                    form.reset();
                } else {
                    result.textContent = "Submission failed ❌";
                    result.className = "result error";
                }

            } catch (error) {
                result.textContent = "Something went wrong ❌";
                result.className = "result error";
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
