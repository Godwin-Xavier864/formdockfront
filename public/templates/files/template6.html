<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Form - Neo-Brutalist</title>
    <!-- Bold Geometric Font for Neo-Brutalism -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Neo-Brutalist Palette */
            --bg-color: #FFF9DB;
            /* Playful Pale Yellow */
            --card-bg: #FFFFFF;
            --text-main: #111111;
            --border-color: #111111;
            --primary: #A78BFA;
            /* Vibrant Violet */
            --primary-hover: #8B5CF6;
            --input-focus: #E0E7FF;
            /* Very pale blue/indigo */
            --success-bg: #A3E635;
            /* Lime green */
            --error-bg: #FF8787;
            /* Salmon red */
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle, #000000 1px, transparent 1px);
            background-size: 24px 24px;
            /* classic dot pattern aesthetic */
            color: var(--text-main);
            margin: 0;
            padding: 60px 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 4px solid var(--border-color);
            border-radius: 12px;
            padding: 48px;
            /* Hard geometric drop shadow */
            box-shadow: 12px 12px 0px var(--border-color);
            position: relative;
        }

        .header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 38px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 12px 0;
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .header p {
            font-size: 16px;
            font-weight: 500;
            margin: 0;
            line-height: 1.5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input,
        textarea {
            width: 100%;
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 16px;
            font-family: inherit;
            font-weight: 500;
            color: var(--text-main);
            box-sizing: border-box;
            transition: all 0.2s ease;
            /* Subtle hard shadow for inputs */
            box-shadow: 4px 4px 0px rgba(17, 17, 17, 0.15);
        }

        input::placeholder,
        textarea::placeholder {
            color: #888888;
        }

        input:focus,
        textarea:focus {
            outline: none;
            background: var(--input-focus);
            box-shadow: 4px 4px 0px var(--border-color);
            transform: translate(-2px, -2px);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 12px;
            background: var(--primary);
            color: var(--text-main);
            border: 4px solid var(--border-color);
            border-radius: 8px;
            padding: 18px;
            font-size: 18px;
            font-family: inherit;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 8px 8px 0px var(--border-color);
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease;
        }

        button:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translate(-2px, -2px);
            box-shadow: 10px 10px 0px var(--border-color);
        }

        button:active:not(:disabled) {
            /* The satisfying "click" effect */
            transform: translate(8px, 8px);
            box-shadow: 0px 0px 0px var(--border-color);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: 8px 8px 0px var(--border-color);
            background: #D4D4D8;
        }

        .result {
            margin-top: 32px;
            padding: 16px;
            border: 3px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            box-shadow: 6px 6px 0px var(--border-color);
        }

        .result:empty {
            display: none;
        }

        .success {
            background: var(--success-bg);
            color: var(--text-main);
        }

        .error {
            background: var(--error-bg);
            color: var(--text-main);
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 32px 24px;
                box-shadow: 8px 8px 0px var(--border-color);
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <h1>Contact Us</h1>
            <p>We'd love to hear from you. Please fill out this form.</p>
        </div>

        <form id="formdockForm" class="form-grid">
            <div class="input-group">
                <label for="firstName">First name</label>
                <input id="firstName" placeholder="John" />
            </div>

            <div class="input-group">
                <label for="lastName">Last name</label>
                <input id="lastName" placeholder="Doe" />
            </div>

            <div class="input-group full-width">
                <label for="email">Email address</label>
                <input id="email" type="email" placeholder="john@example.com" />
            </div>

            <div class="input-group">
                <label for="organization">Organization</label>
                <input id="organization" placeholder="Company inc" />
            </div>

            <div class="input-group">
                <label for="place">Place</label>
                <input id="place" placeholder="City" />
            </div>

            <div class="input-group full-width">
                <label for="message">Message</label>
                <textarea id="message" placeholder="How can we help you?"></textarea>
            </div>

            <div class="full-width">
                <button type="submit" id="submitBtn">Send Message</button>
            </div>
        </form>

        <div class="result" id="result"></div>
    </div>

    <!-- The original JavaScript code remains completely unchanged. -->
    <script>
        const form = document.getElementById("formdockForm");
        const result = document.getElementById("result");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            submitBtn.disabled = true;

            result.textContent = "Submitting...";
            result.className = "result";

            const payload = {
                project_api_key: "YOUR_API_KEY",
                fields: {
                    first_name: document.getElementById("firstName").value.trim(),
                    last_name: document.getElementById("lastName").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    organization: document.getElementById("organization").value.trim(),
                    place: document.getElementById("place").value.trim(),
                    message: document.getElementById("message").value.trim()
                },
                metadata: {
                    page_url: window.location.href,
                    referrer: document.referrer || "",
                    user_agent: navigator.userAgent,
                    timestamp: new Date().toISOString()
                }
            };

            try {
                const response = await fetch("https://api.formdock.in/api/forms/submit/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    result.textContent = "Form submitted successfully ✅";
                    result.className = "result success";
                    form.reset();
                } else {
                    result.textContent = "Submission failed ❌";
                    result.className = "result error";
                }

            } catch (error) {
                result.textContent = "Something went wrong ❌";
                result.className = "result error";
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
