<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SolGreen • fresh contact form</title>
  
  <!-- modern font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #e8f5e9 0%, #f9f7e8 100%);
      color: #1f3b2c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* white card with subtle green & yellow accents */
    .card {
      max-width: 780px;
      width: 100%;
      background: #ffffff;
      border-radius: 1.75rem;
      box-shadow: 0 20px 35px -12px rgba(60, 80, 30, 0.15);
      padding: 2rem 2rem 2.2rem;
      transition: box-shadow 0.2s ease;
      border-top: 5px solid #f5d742;
      border-left: 1px solid #e9f0e5;
      border-right: 1px solid #e9f0e5;
      border-bottom: 1px solid #e9f0e5;
    }

    .card:hover {
      box-shadow: 0 25px 40px -14px rgba(70, 100, 40, 0.2);
    }

    /* title with green and yellow hint */
    h1 {
      font-size: 1.9rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #2b6e3c, #6f9e3f);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 0.25rem;
      display: inline-block;
      border-bottom: 3px solid #f9e45b;
      padding-bottom: 6px;
    }

    form {
      margin-top: 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    /* labels – fresh green */
    label {
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #3f6b3c;
      margin-top: 1rem;
      margin-bottom: 0.3rem;
    }

    form > label:first-of-type {
      margin-top: 0;
    }

    /* inputs – white with green border, yellow focus */
    input, textarea {
      width: 100%;
      border: 1.5px solid #d9e5cf;
      border-radius: 1rem;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 450;
      background: #ffffff;
      transition: all 0.2s ease;
      color: #1f3b2c;
      outline: none;
      line-height: 1.4;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* focus state – yellow-green glow */
    input:focus, textarea:focus {
      border-color: #f5d742;
      box-shadow: 0 0 0 3px rgba(245, 215, 66, 0.3);
      background-color: #fffef7;
    }

    input:hover, textarea:hover {
      border-color: #cfe2bc;
      background-color: #fefef9;
    }

    ::placeholder {
      color: #b8cfaa;
      font-weight: 400;
      font-size: 0.85rem;
    }

    /* button – green gradient with yellow hover */
    button {
      margin-top: 1.8rem;
      border: none;
      border-radius: 2rem;
      background: linear-gradient(95deg, #2d6a3b, #4a8549);
      color: white;
      padding: 0.85rem 1.4rem;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: all 0.25s ease;
      width: 100%;
      font-family: inherit;
      box-shadow: 0 2px 6px rgba(60, 100, 40, 0.2);
    }

    button:hover {
      background: linear-gradient(95deg, #3f7e44, #5f9e4e);
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(80, 130, 50, 0.25);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.6;
      transform: none;
      cursor: not-allowed;
      background: #94b882;
      box-shadow: none;
    }

    /* result messages – green/yellow feedback */
    .result {
      margin-top: 1.5rem;
      padding: 0.8rem 1rem;
      border-radius: 1rem;
      font-weight: 500;
      font-size: 0.9rem;
      text-align: center;
      background: #fefdf5;
      border: 1px solid #e6f0e0;
      transition: all 0.2s;
      color: #2b5a2f;
    }

    .success {
      background: #e9f7e1;
      color: #2a6e3a;
      border-left: 5px solid #7bb84b;
    }

    .error {
      background: #fff3e8;
      color: #c26b2e;
      border-left: 5px solid #f5b342;
    }

    /* responsive */
    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }
      .card {
        padding: 1.5rem;
        border-radius: 1.25rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      input, textarea {
        padding: 0.7rem 0.9rem;
      }
      button {
        padding: 0.75rem 1rem;
      }
    }

    .result:empty {
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Contact Us</h1>

    <form id="formdockForm">
      <label>First Name</label>
      <input id="firstName" placeholder="John" />

      <label>Last Name</label>
      <input id="lastName" placeholder="Doe" />

      <label>Email</label>
      <input id="email" type="email" placeholder="john@example.com" />

      <label>Organization</label>
      <input id="organization" placeholder="Company" />

      <label>Place</label>
      <input id="place" placeholder="City" />

      <label>Message</label>
      <textarea id="message" placeholder="Your message..."></textarea>

      <button type="submit" id="submitBtn">Submit</button>
    </form>

    <div class="result" id="result"></div>
  </div>

  
  <script>
    const form = document.getElementById("formdockForm");
    const result = document.getElementById("result");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      submitBtn.disabled = true;

      result.textContent = "Submitting...";
      result.className = "result";

      const payload = {
        project_api_key: "YOUR_API_KEY",
        fields: {
          first_name: document.getElementById("firstName").value.trim(),
          last_name: document.getElementById("lastName").value.trim(),
          email: document.getElementById("email").value.trim(),
          organization: document.getElementById("organization").value.trim(),
          place: document.getElementById("place").value.trim(),
          message: document.getElementById("message").value.trim()
        },
        metadata: {
          page_url: window.location.href,
          referrer: document.referrer || "",
          user_agent: navigator.userAgent,
          timestamp: new Date().toISOString()
        }
      };

      try {
        const response = await fetch("https://api.formdock.in/api/forms/submit/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          result.textContent = "Form submitted successfully ✅";
          result.className = "result success";
          form.reset();
        } else {
          result.textContent = "Submission failed ";
          result.className = "result error";
        }

      } catch (error) {
        result.textContent = "Something went wrong ";
        result.className = "result error";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
