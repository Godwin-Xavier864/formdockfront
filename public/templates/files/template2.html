<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Form</title>
    <!-- Minimalist Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-color: #000000;
            --brand-hover: #333333;
            --bg-color: #fafafa;
            --surface: #ffffff;
            --border-light: #eaeaea;
            --border-input: #e4e4e7;
            --text-heading: #09090b;
            --text-body: #52525b;
            --text-label: #3f3f46;
            --focus-ring: rgba(0, 0, 0, 0.08);
            --success-bg: #f0fdf4;
            --success-text: #166534;
            --success-border: #bbf7d0;
            --error-bg: #fef2f2;
            --error-text: #991b1b;
            --error-border: #fecaca;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-body);
            margin: 0;
            padding: 48px 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .card {
            width: 100%;
            max-width: 540px;
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 48px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
        }

        .header {
            margin-bottom: 36px;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            color: var(--text-heading);
            margin: 0 0 8px 0;
            letter-spacing: -0.02em;
        }

        .header p {
            color: var(--text-body);
            font-size: 15px;
            line-height: 1.5;
            margin: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 16px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-label);
        }

        input,
        textarea {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border-input);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            color: var(--text-heading);
            box-sizing: border-box;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            font-family: inherit;
        }

        input::placeholder,
        textarea::placeholder {
            color: #a1a1aa;
        }

        input:hover,
        textarea:hover {
            border-color: #a1a1aa;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--text-heading);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 12px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: var(--brand-color);
            color: #fff;
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background: var(--brand-hover);
        }

        button:active:not(:disabled) {
            transform: scale(0.99);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 24px;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        .result:empty {
            display: none;
        }

        .success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .error {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
        }

        @media (max-width: 500px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <h1>Contact Us</h1>
            <p>We'd love to hear from you. Please fill out this form.</p>
        </div>

        <form id="formdockForm" class="form-grid">
            <div class="input-group">
                <label for="firstName">First name</label>
                <input id="firstName" placeholder="John" />
            </div>

            <div class="input-group">
                <label for="lastName">Last name</label>
                <input id="lastName" placeholder="Doe" />
            </div>

            <div class="input-group full-width">
                <label for="email">Email address</label>
                <input id="email" type="email" placeholder="john@example.com" />
            </div>

            <div class="input-group">
                <label for="organization">Organization</label>
                <input id="organization" placeholder="Company inc" />
            </div>

            <div class="input-group">
                <label for="place">Place</label>
                <input id="place" placeholder="City" />
            </div>

            <div class="input-group full-width">
                <label for="message">Message</label>
                <textarea id="message" placeholder="How can we help you?"></textarea>
            </div>

            <div class="full-width">
                <button type="submit" id="submitBtn">Send Message</button>
            </div>
        </form>

        <div class="result" id="result"></div>
    </div>

    <!-- The original JavaScript code remains completely unchanged. -->
    <script>
        const form = document.getElementById("formdockForm");
        const result = document.getElementById("result");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            submitBtn.disabled = true;

            result.textContent = "Submitting...";
            result.className = "result";

            const payload = {
                project_api_key: "YOUR_API_KEY",
                fields: {
                    first_name: document.getElementById("firstName").value.trim(),
                    last_name: document.getElementById("lastName").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    organization: document.getElementById("organization").value.trim(),
                    place: document.getElementById("place").value.trim(),
                    message: document.getElementById("message").value.trim()
                },
                metadata: {
                    page_url: window.location.href,
                    referrer: document.referrer || "",
                    user_agent: navigator.userAgent,
                    timestamp: new Date().toISOString()
                }
            };

            try {
                const response = await fetch("https://api.formdock.in/api/forms/submit/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    result.textContent = "Form submitted successfully ✅";
                    result.className = "result success";
                    form.reset();
                } else {
                    result.textContent = "Submission failed ❌";
                    result.className = "result error";
                }

            } catch (error) {
                result.textContent = "Something went wrong ❌";
                result.className = "result error";
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
