<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NovaForm • modern contact</title>
  
  <!-- modern font stack: Inter (clean, highly legible) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      background: #f4f6fa;
      color: #1a2c3e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* modern card – clean, elevated, with soft radius */
    .card {
      max-width: 780px;
      width: 100%;
      background: #ffffff;
      border-radius: 1.5rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.02);
      padding: 2rem 2rem 2.2rem;
      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
    }

    /* modern title – clean and confident */
    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0f2b3b;
      margin-bottom: 0.25rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #eef2f8;
      display: inline-block;
    }

    /* no extra decorations, just simplicity */
    form {
      margin-top: 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    /* labels – compact, modern, easy to scan */
    label {
      font-weight: 500;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #5b6e8c;
      margin-top: 1rem;
      margin-bottom: 0.3rem;
    }

    /* first label no extra top space */
    form > label:first-of-type {
      margin-top: 0;
    }

    /* modern inputs – subtle border, large padding, focus ring */
    input, textarea {
      width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 450;
      background: #ffffff;
      transition: all 0.2s ease;
      color: #1a2c3e;
      outline: none;
      line-height: 1.4;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* focus state – modern ring (no blur, clean) */
    input:focus, textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      background-color: #fefefe;
    }

    /* subtle hover effect */
    input:hover, textarea:hover {
      border-color: #cbd5e1;
      background-color: #fafcff;
    }

    /* placeholder – light and minimal */
    ::placeholder {
      color: #9aaebf;
      font-weight: 400;
      font-size: 0.85rem;
    }

    /* button – modern solid, rounded, with smooth transition */
    button {
      margin-top: 1.8rem;
      border: none;
      border-radius: 0.85rem;
      background: #1e4b6e;
      color: white;
      padding: 0.85rem 1.4rem;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      font-family: inherit;
      background-color: #2563eb;
    }

    button:hover {
      background-color: #1d4ed8;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.6;
      transform: none;
      cursor: not-allowed;
      background-color: #94a3b8;
    }

    /* result messages – clean and informative */
    .result {
      margin-top: 1.5rem;
      padding: 0.8rem 1rem;
      border-radius: 0.75rem;
      font-weight: 500;
      font-size: 0.9rem;
      text-align: center;
      background: #f8fafc;
      border: 1px solid #eef2f8;
      transition: all 0.2s;
    }

    .success {
      background: #e6f7ec;
      color: #1e6f3f;
      border-left: 4px solid #2b9348;
    }

    .error {
      background: #fee9e9;
      color: #b91c1c;
      border-left: 4px solid #e05a4f;
    }

    /* responsive adjustments */
    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }
      .card {
        padding: 1.5rem;
        border-radius: 1.25rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      input, textarea {
        padding: 0.7rem 0.9rem;
      }
      button {
        padding: 0.75rem 1rem;
      }
    }

    /* utility: remove extra spacing */
    .result:empty {
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Contact Us</h1>

    <form id="formdockForm">
      <label>First Name</label>
      <input id="firstName" placeholder="John" />

      <label>Last Name</label>
      <input id="lastName" placeholder="Doe" />

      <label>Email</label>
      <input id="email" type="email" placeholder="john@example.com" />

      <label>Organization</label>
      <input id="organization" placeholder="Company" />

      <label>Place</label>
      <input id="place" placeholder="City" />

      <label>Message</label>
      <textarea id="message" placeholder="Your message..."></textarea>

      <button type="submit" id="submitBtn">Submit</button>
    </form>

    <div class="result" id="result"></div>
  </div>


  <script>
    const form = document.getElementById("formdockForm");
    const result = document.getElementById("result");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      submitBtn.disabled = true;

      result.textContent = "Submitting...";
      result.className = "result";

      const payload = {
        project_api_key: "YOUR_API_KEY",
        fields: {
          first_name: document.getElementById("firstName").value.trim(),
          last_name: document.getElementById("lastName").value.trim(),
          email: document.getElementById("email").value.trim(),
          organization: document.getElementById("organization").value.trim(),
          place: document.getElementById("place").value.trim(),
          message: document.getElementById("message").value.trim()
        },
        metadata: {
          page_url: window.location.href,
          referrer: document.referrer || "",
          user_agent: navigator.userAgent,
          timestamp: new Date().toISOString()
        }
      };

      try {
        const response = await fetch("https://api.formdock.in/api/forms/submit/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          result.textContent = "Form submitted successfully ";
          result.className = "result success";
          form.reset();
        } else {
          result.textContent = "Submission failed ";
          result.className = "result error";
        }

      } catch (error) {
        result.textContent = "Something went wrong ";
        result.className = "result error";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
